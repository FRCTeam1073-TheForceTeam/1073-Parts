# Fly.io config for 1073 Parts. `app` must be unique on Fly; change it if the name is taken.
app = "frc1073-parts"
primary_region = "bos" # Boston, closest to the team

[build]

[env]
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

# Persistent disk for the SQLite database, photos and part files. Fly snapshots it daily.
[mounts]
  source = "parts_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleeps when nobody is using it (cheaper) and wakes in a second or two on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
