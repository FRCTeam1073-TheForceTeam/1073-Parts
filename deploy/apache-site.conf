# 1073 Parts: reverse proxy to the Node app on 127.0.0.1:8090 (see deploy/parts.service).
# Install: sudo cp deploy/apache-site.conf /etc/apache2/sites-available/parts.conf
#          sudo a2ensite parts && sudo apache2ctl configtest && sudo systemctl reload apache2
# The app has its own login, so this vhost does not add HTTP basic/digest auth.

<VirtualHost *:443>
	ServerName parts.deadsea.ostermiller.org
	Include include/oster-ssl.conf
	Include include/redirect-proxied-http-to-https.conf
	Include include/early-reject-probes.conf

	ProxyRequests Off
	ProxyPreserveHost On
	ProxyPass / http://127.0.0.1:8090/
	ProxyPassReverse / http://127.0.0.1:8090/
	RequestHeader set X-Forwarded-Proto https
</VirtualHost>


<VirtualHost *:80>
	ServerName parts.deadsea.ostermiller.org
	RewriteEngine On

	Include include/early-reject-probes.conf

	redirect permanent / https://parts.deadsea.ostermiller.org/
</VirtualHost>
